<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bernard | Delivery &amp; Release Management and Enterprise AI</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this file for any unknown path (e.g. /admin).
      // It rewrites the path into a query string and redirects to the real
      // index.html, which main.jsx then decodes back into the original URL.
      var pathSegmentsToKeep = 1; // keep "/live_3D-portfolio"

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
